name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64, so it runs the NEON backend.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Rust tests, every backend this runner supports
        run: cargo test --release

      - name: Rust tests with AVX-512 capped away
        if: runner.arch == 'X64'
        run: cargo test --release
        env:
          RUSTKERNEL_ISA: avx2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Python bindings
        shell: bash
        run: |
          python -m pip install numpy
          python -m pip install .
          python tests/test_bindings.py --time
