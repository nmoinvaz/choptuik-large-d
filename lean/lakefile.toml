name = "DSS"
defaultTargets = ["DSS"]

[leanOptions]
autoImplicit = false
# a proof left as `sorry` warns, so this fails the build on one
warningAsError = true

# Lean and Mathlib v4.34.1: v4.34.0-rc2's executables abort at thread exit on macOS 27 (leanprover/lean4#15087).
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"

[[lean_lib]]
name = "DSS"
