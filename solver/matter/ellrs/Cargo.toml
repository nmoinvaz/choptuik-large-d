[package]
name = "ellrs"
version = "0.1.0"
edition = "2021"
description = "Block 12 (horizon) of the l = 1 mode matrix in double-double: ell_ddm.DDEll's operator in Rust (#1102)"

[lib]
name = "ellrs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module"] }
numpy = "0.30"
rayon = "1.10"
# f64 products of the Ozaki slices; each is exact, so any summation order gives the same bits
matrixmultiply = "0.3.11"
# the 8-lane f64 vectors (multidouble::native::V8) that carry ddnp.py's double-double algorithms
multidouble = "=6.0.0"

[features]
# macOS: the Ozaki products by Accelerate's cblas_dgemm (on the AMX/SME units) instead of matrixmultiply; each product
# is exact, so the bits do not change
accelerate = []

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
debug = false
# macOS 27's dyld refuses a Mach-O whose string table rustc's strip leaves misaligned (as hp/Cargo.toml)
strip = false
