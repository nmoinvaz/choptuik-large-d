[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "hpkernel"
version = "0.1.0"
requires-python = ">=3.9"
# multidouble: its Python package (the double-double helpers the driver uses), from the repository at release 1.5.1's commit
# (tag 1.5.1; the package is not on PyPI); hp/Cargo.toml takes the same release from crates.io
dependencies = ["numpy", "multidouble @ git+https://github.com/nmoinvaz/multidouble@cb221113d1cf4aac62564f6ab1d69f3de19297ae#subdirectory=python"]

[tool.maturin]
python-source = "python"
module-name = "hpkernel._hpkernel"
features = ["python"]
