[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "hpkernel"
version = "0.1.0"
requires-python = ">=3.9"
# multidouble: its Python package (the double-double helpers, dd_matvec and qd_axpy the driver and the checks use), from
# the repository at the commit hp/Cargo.toml names (the package is not on PyPI)
dependencies = ["numpy", "multidouble @ git+https://github.com/nmoinvaz/multidouble@e4f6388b43243ff6b6376d4b78d040d08b93c0d3#subdirectory=python"]

[tool.maturin]
python-source = "python"
module-name = "hpkernel._hpkernel"
features = ["python"]
