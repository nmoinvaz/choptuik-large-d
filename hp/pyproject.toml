[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "hpkernel"
version = "0.1.0"
requires-python = ">=3.9"
# multidouble: its Python package (the double-double helpers the driver uses), from the repository at a fixed commit
dependencies = ["numpy", "multidouble @ git+https://github.com/nmoinvaz/multidouble@23ee209531d4f3f2b326a2a2435e158f76c53367#subdirectory=python"]

[tool.maturin]
python-source = "python"
module-name = "hpkernel._hpkernel"
features = ["python"]
