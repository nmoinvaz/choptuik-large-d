[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "hpkernel"
version = "0.1.0"
requires-python = ">=3.9"
# multidouble: its Python package (the double-double helpers the driver uses), from the repository at a fixed commit
dependencies = ["numpy", "multidouble @ git+https://github.com/nmoinvaz/multidouble@b45c0b9b200eabb61fb85c13439a0142073cbb88#subdirectory=python"]

[tool.maturin]
python-source = "python"
module-name = "hpkernel._hpkernel"
features = ["python"]
