[package]
name = "hpkernel"
version = "0.1.0"
edition = "2021"
description = "Double-double (~32 digit) DSS solver: Taylor stepping in x, collocation in tau, exact forward-mode Jacobian"

[lib]
name = "_hpkernel"
crate-type = ["cdylib", "rlib"]

[features]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module"], optional = true }
numpy = { version = "0.30", optional = true }
rayon = "1.10"
# double-double / quad-double arithmetic, dual lanes and LU (split out of this crate); pinned to a commit
multidouble = { git = "https://github.com/nmoinvaz/multidouble", rev = "6e93c58e87db1ff4c7ab2d6df7a4e375610f65ff" }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
debug = false
