[package]
name = "hpkernel"
version = "0.1.0"
edition = "2021"
description = "Double-double (~32 digit) DSS solver: Taylor stepping in x, collocation in tau, exact forward-mode Jacobian"

[lib]
name = "_hpkernel"
crate-type = ["cdylib", "rlib"]

[features]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module"], optional = true }
numpy = { version = "0.30", optional = true }
rayon = "1.10"
# double-double / quad-double arithmetic, dual lanes and LU (split out of this crate; crates.io)
# the multiple-shooting engine (crates.io; github.com/nmoinvaz/multishoot): layout, residual, exact Jacobians, jets, jvp, mode
# matrix, f64 and staircase Jacobians; hp supplies the equations (model.rs). Its feature `mutate` gives the staircase
# controls of hp/highm_check.py and the half-parts state controls of the quad- and octo-double checks.
multishoot = { version = "=4.0.0", features = ["mutate"] }  # 3.3.0: JetSession::tangent_from (PR #46); 4.0.0: plan_segments_auto, Broyden in fast, family, sub-blocks
# the solvers of F(z) = 0 over multishoot's layout (crates.io; github.com/nmoinvaz/multisolver): Newton's step and loop,
# chord, GMRES-refined Newton, Levenberg-Marquardt, ANM series, predictors, weak subspaces, the winding count
multisolver = "=0.2.1"  # 0.2.0: quasi (Broyden), dd or f64 Newton matrices, arclength, deflation; 0.2.1: deflation through the problem's own factors
multidouble = "=5.0.0"  # 1.8.0: the pieces moved there from hp (PR #25); 1.9.0: the jet lanes and the parameter arithmetic (PR #26, notes/QUAD_DOUBLE.md 13.15); 2.0.0: the quad-double jet QJet (PR #29); 2.1.0: the jet solves and helpers moved from hp (PR #30); 3.0.0: octo-double (PR #32); 3.1.0: quad-double parts summed in any order (PR #33); 3.2.0: in-place Cauchy sums and accumulation (PR #35); 4.0.0: the octo-double jet OJet, its series and solve, and the octo-double dual Ou (PRs #36, #38-#40); 4.1.0: the Precision trait (Double, Quad, Octo; PRs #41, #42); 4.1.1, 4.2.0, 4.2.1: performance (PRs #43-#48); 4.3.0: jet Cauchy sums split over threads (PR #49); 4.4.0: the Python gcr where GMRES stagnates (PR #50); 4.5.0: the blocked complex LU of clu_logdet (PR #51); 4.6.0: clu_pivots, its pivots recorded (PR #52); 4.7.0: the jets' order-k operations (PR #53); 4.8.0: Oun, the octo-double dual with N tangents (PR #55); 4.8.1: the octo-double renormalization's second pass by two-sums (PR #56); 4.8.2: its scalar branch to the quick-two-sum where exact (PR #57); 4.9.0: the order-k sums split over threads (PR #77, #81), the double-double operand's zero products skipped (PR #72), the opt-in sloppy multiply (PR #76), sqrt from the double-double root (PRs #78, #79), fast_div (PR #74); 4.9.1: the f64 lanes' matrix products by chunks of 8 columns (PR #117); 5.0.0: NEON renormalizations inlined (needed by multishoot 4.0.0)

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
debug = false
# Cargo strips debuginfo from release builds by default with rustc's bundled llvm-objcopy, which on macOS can leave the
# Mach-O string table at an offset that is not a multiple of 8; macOS 27's dyld then refuses to load the extension
# ("mis-aligned LINKEDIT string pool"; found on the Mac runner, comms.txt 2026-10-24 22:44 UTC). Unstripped, the table is
# aligned. The arithmetic is unchanged; the symbol and debug sections stay, and the code's layout can shift.
strip = false

# Working builds: thin LTO over 16 codegen units compiles far faster than release's fat LTO over one. Rust neither fuses
# nor reorders floating-point operations, so the arithmetic should match release, but compare a run's digits with a
# release build before quoting them. Built with `HP_PROFILE=release-dev hp/build.sh`.
[profile.release-dev]
inherits = "release"
lto = "thin"
codegen-units = 16
