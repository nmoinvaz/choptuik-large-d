[package]
name = "hpkernel"
version = "0.1.0"
edition = "2021"
description = "Double-double (~32 digit) DSS solver: Taylor stepping in x, collocation in tau, exact forward-mode Jacobian"

[lib]
name = "_hpkernel"
crate-type = ["cdylib", "rlib"]

[features]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module"], optional = true }
numpy = { version = "0.30", optional = true }
rayon = "1.10"
# double-double / quad-double arithmetic, dual lanes and LU (split out of this crate; crates.io)
multidouble = "=2.1.0"  # 1.8.0: the pieces moved there from hp (PR #25); 1.9.0: the jet lanes and the parameter arithmetic (PR #26, notes/QUAD_DOUBLE.md 13.15); 2.0.0: the quad-double jet QJet (PR #29); 2.1.0: the jet solves and helpers moved from hp (PR #30)

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
debug = false
# Cargo strips debuginfo from release builds by default with rustc's bundled llvm-objcopy, which on macOS can leave the
# Mach-O string table at an offset that is not a multiple of 8; macOS 27's dyld then refuses to load the extension
# ("mis-aligned LINKEDIT string pool"; found on the Mac runner, comms.txt 2026-10-24 22:44 UTC). Unstripped, the table is
# aligned. The arithmetic is unchanged; the symbol and debug sections stay, and the code's layout can shift.
strip = false
