<text x="16.0" y="24.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="bold">What a Newton step is</text>
<text x="16.0" y="42.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">To solve f(x) = 0, replace f by its tangent at the current point and jump to where the tangent is zero: x_new = x − f(x) / f′(x).</text>
<text x="70.0" y="80.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">One step: follow the tangent to zero</text>
<text x="70.0" y="96.0" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">f(x) = x² − 2, from x₀ = 3; the root is √2</text>
