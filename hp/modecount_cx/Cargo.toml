[package]
name = "modecount_cx"
version = "0.1.0"
edition = "2021"
description = "Growth-mode determinant det M(lambda) of the double-double DSS kernel (hp/) at complex lambda, for the argument-principle mode count (notes/MODE_COUNT.md)"

[lib]
name = "modecount_cx"
crate-type = ["cdylib"]

[workspace]

[dependencies]
hpk = { package = "hpkernel", path = "..", default-features = false }
# the generic SIMD types for pivots.rs's copy of clu_logdet; the version hp pins, so cargo uses the one crate
multidouble = "=4.7.0"
# the engine's mode matrix at a complex rate (Shooting::mode_matrix, Rate); the version hp pins, one crate
multishoot = "=3.1.0"
pyo3 = { version = "0.30", features = ["extension-module"] }
numpy = "0.30"
rayon = "1.10"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
debug = false
# not stripped: the stripped Mach-O fails to load on macOS 27 (as hp/Cargo.toml)
strip = false

# multidouble's Oun (PR #55) and multishoot's jacobian_tangents (PR #44), for every crate in the graph, until their
# releases; removed then, with the pins moved to them
[patch.crates-io]
multidouble = { git = "https://github.com/nmoinvaz/multidouble", branch = "feat/oun-lanes" }
multishoot = { git = "https://github.com/nmoinvaz/multishoot", branch = "feat/jacobian-tangents" }
