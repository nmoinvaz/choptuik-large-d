# CPU side of notes/GPU_FEASIBILITY.md: throughput of multidouble's lane axpy y + l t (the QDLu
# rank-1 update's kernel) per thread and on N threads, and the kernels whose instructions count.py counts.
[package]
name = "gpu_probe"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
multidouble = "=2.2.0"

[features]
# octo-double lanes: needs multidouble's feat/octo-double branch through a [patch] (notes/GPU_FEASIBILITY.md)
od = []

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
