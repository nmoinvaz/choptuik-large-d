[package]
name = "rustkernel"
version = "0.1.0"
edition = "2021"
description = "Rust port of the DSSSpec multiple-shooting residual (spec_long + freeze_steps variant)"

[lib]
name = "_rustkernel"
crate-type = ["cdylib", "rlib"]

[features]
# PyO3 bindings, enabled by maturin through pyproject.toml.
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "num-complex"], optional = true }
numpy = { version = "0.30", optional = true }
rayon = "1.10"
num-complex = "0.4"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
debug = false
